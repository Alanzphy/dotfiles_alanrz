[global]
last_wallpaper = "33"
queue_mode = "sequential"
rotation_secs = 0
audio_fade_ms = 500
mute_when_other_audio = false
audio_capture_enabled = false
manual_muted = false
wallpaper_filter_json = '{"filters":[],"filter_logics":[]}'
wallpaper_sorts = []
wallpaper_skip_types = []
wallpaper_filter_tags = []
wallpaper_skip_content_ratings = []
wallpaper_hidden_filter = "exclude"
plugin_update_notifications = true
duplicate_renderers_for_same_wallpaper = false
pointer_forwarding_enabled = true
autostart_enabled = false
hide_tray_icon = false
debug_logging_enabled = false

[global.renderer]
enable_audio = false
volume = 100

[global.layout]
fillmode = "preserve_aspect_crop"
align = "center"
rotation = "normal"

[global.layout.location]
x = 50
y = 50

[global.auto_replay]
any_window_scope = "current_display"
focused_scope = "current_display"
maximized_scope = "all_displays"
fullscreen_scope = "all_displays"
any_window = "none"
focused = "none"
maximized = "pause"
fullscreen = "pause"
session_locked = "stop"
session_inactive = "stop"
gamemode = "pause"
resume_delay_ms = 250

[global.auto_replay.window_exclusions]
application_ids = []
titles = []
application_id_patterns = []
title_patterns = []

[global.pause_effect]
kind = "none"

[global.pause_effect.blur]
radius = 30

[global.transition]
kind = "fade"
duration_ms = 500
angle = 0

[global.transition.origin]
x = 50
y = 50

[plugin.weweb-renderer]
volume = "100"
render_node = ""
shared_texture_enabled = "true"
fps = "30"
resolution = "2"
remote_debugging_port = "0"
enable_audio = "false"

[plugin.waywallen-video]
