# Per-user makepkg overrides (sourced after /etc/makepkg.conf).
#
# Arch ships `debug` in OPTIONS, which makes every AUR build emit a separate
# <pkg>-debug split package. yay/paru then install those alongside the real
# package, as deps, on every update.
#
# !debug stops the debug split from being built/installed. Keep the rest of the
# system OPTIONS list identical so nothing else changes.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
