# Oh My Zsh + custom plugins referenced by ~/.zshrc `plugins=(...)`.
# Refresh (update) with: chezmoi -R apply

[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/fzf-tab"]
    type = "archive"
    url = "https://github.com/Aloxaf/fzf-tab/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/F-Sy-H"]
    type = "archive"
    url = "https://github.com/z-shell/F-Sy-H/archive/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
